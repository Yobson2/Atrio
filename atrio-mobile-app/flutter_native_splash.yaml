# Native splash screen configuration — Board 04 (Portal A on brand teal).
#
# Images are 4x (xxxhdpi) renders of assets/images/logo_mark_white.svg.
# Run: dart run flutter_native_splash:create (or: make splash)
#
# See: https://pub.dev/packages/flutter_native_splash

flutter_native_splash:
  # Brand teal in both modes so the hand-off to SplashPage is seamless
  color: "#00685F"
  color_dark: "#00685F"

  # Mark + "atrio" wordmark, centered
  image: assets/images/splash.png
  image_dark: assets/images/splash.png

  # Android 12+ only allows a centered icon (no wordmark)
  android_12:
    color: "#00685F"
    color_dark: "#00685F"
    image: assets/images/splash_android12.png
    image_dark: assets/images/splash_android12.png

  web: false
