<body class="bg-surface font-body text-on-surface min-h-screen flex flex-col">
<!-- Header Anchor -->
<header class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-md px-6 py-6 flex justify-center items-center">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="content_cut">content_cut</span>
<h1 class="text-xl font-extrabold tracking-tighter text-teal-700">Atrio</h1>
</div>
</header>
<main class="flex-grow flex items-center justify-center px-6 pt-24 pb-12">
<div class="w-full max-w-md bg-surface-container-lowest rounded-[24px] p-8 md:p-10 shadow-[0px_12px_32px_rgba(25,28,30,0.06)] relative overflow-hidden">
<!-- Editorial Flourish (Asymmetric Background) -->
<div class="absolute -top-12 -right-12 w-32 h-32 bg-primary/5 rounded-full blur-3xl"></div>
<!-- Content -->
<div class="relative z-10 text-center">
<div class="mb-8">
<h2 class="text-3xl font-bold tracking-tight text-on-surface mb-3">Verify Email</h2>
<p class="text-on-surface-variant leading-relaxed">
            Enter the 6-digit code sent to <span class="font-semibold text-primary">alex.p@artisan.com</span>
</p>
</div>
<form class="space-y-10">
<!-- OTP Input Group -->
<div class="flex justify-between gap-2 sm:gap-3">
<input class="otp-input w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl font-bold rounded-xl bg-surface-container-low border-transparent focus:border-primary focus:ring-0 transition-all text-on-surface" maxlength="1" type="text" value="5"/>
<input class="otp-input w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl font-bold rounded-xl bg-surface-container-low border-transparent focus:border-primary focus:ring-0 transition-all text-on-surface" maxlength="1" type="text" value="2"/>
<input class="otp-input w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl font-bold rounded-xl bg-surface-container-low border-transparent focus:border-primary focus:ring-0 transition-all text-on-surface" maxlength="1" placeholder="0" type="text"/>
<input class="otp-input w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl font-bold rounded-xl bg-surface-container-low border-transparent focus:border-primary focus:ring-0 transition-all text-on-surface" maxlength="1" placeholder="0" type="text"/>
<input class="otp-input w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl font-bold rounded-xl bg-surface-container-low border-transparent focus:border-primary focus:ring-0 transition-all text-on-surface" maxlength="1" placeholder="0" type="text"/>
<input class="otp-input w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl font-bold rounded-xl bg-surface-container-low border-transparent focus:border-primary focus:ring-0 transition-all text-on-surface" maxlength="1" placeholder="0" type="text"/>
</div>
<div class="space-y-6">
<!-- Done Button -->
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary py-4 rounded-xl font-bold text-lg shadow-[0px_8px_20px_rgba(0,104,95,0.2)] hover:scale-[1.01] active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
              Done
              <span class="material-symbols-outlined text-xl" data-icon="arrow_forward">arrow_forward</span>
</button>
<!-- Resend OTP Link -->
<div class="flex flex-col items-center gap-4">
<p class="text-sm text-on-surface-variant">Didn't receive the code?</p>
<button class="text-primary font-bold text-sm hover:underline underline-offset-4 decoration-2 transition-all" type="button">
                Resend OTP
              </button>
</div>
</div>
</form>
</div>
</div>
</main>
<!-- Decorative Context Image (Soft Studio Background) -->
<div class="fixed inset-0 -z-10 opacity-30 pointer-events-none">
<img class="w-full h-full object-cover grayscale" data-alt="Interior of a luxury modern barbershop with sleek leather chairs, large mirrors, and warm ambient lighting in soft focus" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDvF3bka6wa2FBHdHd578CMGhOmAoCtqzhrwbmPBNO5CfOljRFxatWPzqX5KGT-MHaXZCxkIryc5If8mP7tb23GtVHAaNBjinISwgjJrtlIuE1PujZXQx1d4uMjYa4Y7Zbv8iaqzHxTSp5SetnypnHgoI0TSbz2ONLPE0Mcw2VOnKmNq2JW-QijOoD0wakq-ErMKryA-bAlq2X2sQElMdzSRbkMW4YDWjYDWvybj-JiOCH1RCMZ64V9p-zTANJKnHtDCeVx5vmblfpJ"/>
