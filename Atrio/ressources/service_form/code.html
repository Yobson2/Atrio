<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Atrio - Add Service</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                    "outline": "#6d7a77",
                    "surface-bright": "#f7f9fb",
                    "on-tertiary-container": "#fffbff",

                    "error-container": "#ffdad6",
                    "secondary-fixed-dim": "#4edea3",
                    "on-tertiary": "#ffffff",
                    "on-surface": "#191c1e",
                    "secondary": "#006c49",
                    "surface-variant": "#e0e3e5",
                    "on-secondary-fixed": "#002113",
                    "on-primary-fixed": "#00201d",
                    "on-secondary-container": "#00714d",
                    "primary": "#00685f",
                    "outline-variant": "#bcc9c6",
                    "inverse-on-surface": "#eff1f3",
                    "secondary-fixed": "#6ffbbe",
                    "inverse-surface": "#2d3133",
                    "tertiary-container": "#b05e3d",
                    "on-background": "#191c1e",
                    "on-surface-variant": "#3d4947",
                    "on-primary-container": "#f4fffc",
                    "on-error": "#ffffff",
                    "on-primary": "#ffffff",
                    "tertiary-fixed-dim": "#ffb59a",
                    "surface-container-lowest": "#ffffff",
                    "background": "#f7f9fb",
                    "on-primary-fixed-variant": "#005049",
                    "surface": "#f7f9fb",
                    "tertiary-fixed": "#ffdbce",
                    "inverse-primary": "#6bd8cb",
                    "surface-dim": "#d8dadc",
                    "on-secondary-fixed-variant": "#005236",

            },
            "borderRadius": {

                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Inter"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .glass-effect {
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
      .ambient-shadow {
        box-shadow: 0px 12px 32px rgba(25, 28, 30, 0.06);
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #bcc9c6;
        border-radius: 10px;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface custom-scrollbar">
<!-- TopAppBar -->
<nav class="fixed top-0 w-full z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md shadow-[0px_12px_32px_rgba(25,28,30,0.06)] flex items-center justify-between px-6 py-4">
<div class="flex items-center gap-4">
<button class="p-2 hover:bg-teal-50 dark:hover:bg-teal-900/30 transition-colors rounded-full scale-95 active:opacity-80">
<span class="material-symbols-outlined text-teal-600 dark:text-teal-400" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="text-xl font-bold tracking-tighter text-teal-700 dark:text-teal-300 font-headline">Add Service</h1>
</div>
<div class="flex items-center gap-2">
<button class="material-symbols-outlined p-2 text-slate-500 dark:text-slate-400" data-icon="help_outline">help_outline</button>
<div class="w-10 h-10 rounded-full overflow-hidden border-2 border-primary/10">
<img class="w-full h-full object-cover" data-alt="professional male barber with a well-groomed beard wearing a clean apron in a bright studio setting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCeGY0NZStR_X-JHjT86D6e_I2crf6-VOOCpEZocjFKTd620zTjh_GLbF75cMVQtCoGAR6wFOvigbGNMeCooMhakP-N8VYCJpfe9dRDbZouUTTg7uIeBK0vDrjpP3RkfC_-z93knkqGF5VtSuYLDSjzav5-8XWeFs6Zam5HV-811eJ07y6kD8481U_vF600OUi3MJoOgzMP1t-ZrsVo_WDPw20rXlOaKz6STBpHJcW4MG0HNGjMBcsyNZ0PEq7ZgEc56UrJfm5e_ztS"/>
</div>
</div>
</nav>
<!-- Content Area -->
<main class="pt-24 pb-32 px-6 max-w-2xl mx-auto">
<form class="space-y-8">
<!-- Hero Image Upload Placeholder -->
<section class="relative group">
<div class="w-full h-56 rounded-3xl bg-surface-container-low flex flex-col items-center justify-center border-2 border-dashed border-outline-variant/30 hover:border-primary/50 transition-all cursor-pointer overflow-hidden group-hover:ambient-shadow">
<div class="text-center p-8">
<span class="material-symbols-outlined text-5xl text-primary/40 mb-3" data-icon="add_a_photo">add_a_photo</span>
<p class="text-on-surface-variant font-medium tracking-tight">Upload Service Image</p>
<p class="text-label-sm text-outline mt-1 italic">Recommended 16:9 ratio</p>
</div>
</div>
</section>
<!-- Form Content -->
<div class="grid grid-cols-1 gap-8">
<!-- Service Name -->
<div class="space-y-2">
<label class="block text-sm font-semibold text-on-surface tracking-tight ml-1">Service name</label>
<input class="w-full px-5 py-4 bg-surface-container-low rounded-xl border-none focus:ring-1 focus:ring-primary placeholder:text-outline/60 text-on-surface transition-all" placeholder="e.g. Signature Fade &amp; Beard Trim" type="text"/>
</div>
<!-- Description -->
<div class="space-y-2">
<label class="block text-sm font-semibold text-on-surface tracking-tight ml-1">Description</label>
<textarea class="w-full px-5 py-4 bg-surface-container-low rounded-xl border-none focus:ring-1 focus:ring-primary placeholder:text-outline/60 text-on-surface transition-all leading-relaxed" placeholder="Describe the techniques, tools, and experience included in this service..." rows="4"></textarea>
</div>
<!-- Bento Grid for Price & Duration -->
<div class="grid grid-cols-2 gap-6">
<div class="space-y-2">
<label class="block text-sm font-semibold text-on-surface tracking-tight ml-1">Price</label>
<div class="relative group">
<span class="absolute left-5 top-1/2 -translate-y-1/2 text-primary font-bold">$</span>
<input class="w-full pl-10 pr-5 py-4 bg-surface-container-low rounded-xl border-none focus:ring-1 focus:ring-primary text-on-surface transition-all" placeholder="45.00" type="number"/>
</div>
</div>
<div class="space-y-2">
<label class="block text-sm font-semibold text-on-surface tracking-tight ml-1">Duration</label>
<div class="relative group">
<span class="absolute right-5 top-1/2 -translate-y-1/2 text-on-surface-variant text-sm font-medium">min</span>
<input class="w-full pl-5 pr-14 py-4 bg-surface-container-low rounded-xl border-none focus:ring-1 focus:ring-primary text-on-surface transition-all" placeholder="45" type="number"/>
</div>
</div>
</div>
<!-- Status & Configuration -->
<div class="bg-surface-container-low p-6 rounded-3xl flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-2xl bg-primary/10 flex items-center justify-center">
<span class="material-symbols-outlined text-primary" data-icon="visibility">visibility</span>
</div>
<div>
<p class="font-bold tracking-tight text-on-surface">Active Toggle</p>
<p class="text-xs text-on-surface-variant leading-tight">Enable this service for client booking</p>
</div>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="w-14 h-8 bg-outline-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-1 after:left-1 after:bg-white after:border-gray-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
<!-- Advanced Options Link -->
<button class="flex items-center gap-2 text-primary font-semibold text-sm hover:translate-x-1 transition-transform w-fit px-1" type="button">
<span>Show advanced service settings</span>
<span class="material-symbols-outlined text-lg" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</form>
</main>
<!-- Bottom Navigation Layer (Action) -->
<div class="fixed bottom-0 left-0 w-full p-6 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md shadow-[0px_-8px_24px_rgba(25,28,30,0.04)] z-50">
<div class="max-w-2xl mx-auto">
<button class="w-full py-5 bg-gradient-to-br from-primary to-primary-container text-white rounded-2xl font-bold tracking-tight text-lg ambient-shadow hover:-translate-y-1 active:scale-95 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>
                Save Service
            </button>
</div>
</div>
<!-- Background Decoration for Editorial Artisan Look -->
<div class="fixed top-0 right-0 -z-10 opacity-20 pointer-events-none">
<svg fill="none" height="400" viewbox="0 0 400 400" width="400" xmlns="http://www.w3.org/2000/svg">
<path d="M400 0C400 220.914 220.914 400 0 400" stroke="url(#paint0_linear)" stroke-width="2"></path>
<defs>
<lineargradient gradientunits="userSpaceOnUse" id="paint0_linear" x1="400" x2="0" y1="0" y2="400">
<stop stop-color="#00685F"></stop>
<stop offset="1" stop-color="#00685F" stop-opacity="0"></stop>
</lineargradient>
</defs>
</svg>
</div>
</body></html>
